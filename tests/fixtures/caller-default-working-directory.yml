name: Caller working-directory fixture
on: workflow_dispatch

defaults:
  run:
    working-directory: tools

jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@1111111111111111111111111111111111111111
      - name: Install Codex
        id: install-codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          mkdir -p "$CODEX_HOME"
          npm install --global @openai/codex@0.145.0
      - name: Run Codex
        id: run-codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: codex exec --skip-git-repo-check "review"
