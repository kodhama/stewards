name: Mixed direct fixture
on: workflow_dispatch

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@1111111111111111111111111111111111111111
      - name: Install Claude Code
        id: install-claude
        run: npm install --global @anthropic-ai/claude-code@2.1.199
      - name: Install Codex
        id: install-codex
        run: npm install --global @openai/codex@0.145.0
      - name: Run Claude
        id: run-claude
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: claude -p "review"
      - name: Run Codex
        id: run-codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: codex exec --skip-git-repo-check "review"
