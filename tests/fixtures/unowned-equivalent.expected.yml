name: Unowned equivalent setup fixture
on: workflow_dispatch

jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@1111111111111111111111111111111111111111
      - name: Install Codex
        id: install-codex
        run: npm install --global @openai/codex@0.145.0
      - name: Caller checkout of the marketplace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kodhama/stewards
          ref: fa862cadf37ad85f71d233a8ec8ecef0c4539ff4
          path: vendor/kodhama-marketplace
          persist-credentials: false
      - name: Caller marketplace registration
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: codex plugin marketplace add ./vendor/kodhama-marketplace --json
      - name: Run Codex
        id: run-codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: codex exec --skip-git-repo-check "review"
