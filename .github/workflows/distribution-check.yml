name: distribution-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kodhama/grove
          ref: db650fe5855a197eb65375b50e3e81b1065ebddb
          path: .product-repositories/grove
      - uses: actions/checkout@v4
        with:
          repository: kodhama/trellis
          ref: 4062120cea71737bd28cb171785a2dcdd6192deb
          path: .product-repositories/trellis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate family distribution metadata
        env:
          STEWARDS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STEWARDS_PRODUCT_REPOSITORIES: '{"kodhama/grove":".product-repositories/grove","kodhama/trellis":".product-repositories/trellis"}'
        run: distribution/check
