name: distribution-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate family distribution metadata
        env:
          STEWARDS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: distribution/check
