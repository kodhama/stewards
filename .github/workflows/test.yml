name: Test

# Every PR and every push to main, with no paths: filter. The node jobs test
# what `npx github:` installs: npm packs a git dependency, so they run the
# suite against the extracted `npm pack` tarball, not the checkout. The
# python job is the repository gate.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 20
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - name: Test the packed tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/kodhama-*.tgz -C "$RUNNER_TEMP"
          KODHAMA_BIN="$RUNNER_TEMP/package/bin/kodhama.mjs" npm test

  node-lts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up the current Node LTS
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
      - name: Test the packed tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/kodhama-*.tgz -C "$RUNNER_TEMP"
          KODHAMA_BIN="$RUNNER_TEMP/package/bin/kodhama.mjs" npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Repository tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
